<!DOCTYPE html>
<!--
  ============================================================
  CLASE 3 - DEMO 2: SOMBRAS Y TRANSICIONES
  ============================================================
  Temas: box-shadow, text-shadow, border-radius, transition,
  los estados :hover y :active, y como respetar al usuario que
  pidio menos animaciones.

  Como probarlo: pasa el mouse por la tarjeta (se levanta) y
  por el boton (crece y cambia de color). Manteniendo apretado
  el boton se ve la sombra hacia adentro (inset).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase 3 - Sombras y transiciones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!--
      <main> marca el contenido principal de la pagina.
      Va uno solo por documento.
    -->
    <section class="card">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Libero ea obcaecati id,
      accusantium cum beatae dolor adipisci ut animi possimus ipsum soluta
      necessitatibus. Fugiat atque aspernatur inventore veritatis vel repudiandae?
    </section>

    <!-- Un boton sin texto, solo para ver la animacion.
         En una pagina real siempre lleva texto o un aria-label. -->
    <button type="button" aria-label="Boton de ejemplo"></button>
  </main>
</body>
</html>
